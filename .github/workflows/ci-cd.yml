name: CI / CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: 1 - Django tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-key-not-for-production-at-least-32-characters
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test --verbosity 2

  lint:
    name: 2 - Ruff lint
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.10"
          args: "check ."

  build:
    name: 3 - Docker build
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Compute immutable image tag
        id: image
        shell: bash
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Authenticate to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish only from develop
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 4 - Deploy to Ubuntu
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment: production
    env:
      DEPLOY_IMAGE: ${{ needs.build.outputs.image_tag }}
      SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
      SERVER_USER: ${{ secrets.DEPLOY_USER }}
      SERVER_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v6
      - name: Upload deployment configuration and start services
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SERVER_HOST:?Set DEPLOY_HOST in GitHub secrets}"
          : "${SERVER_USER:?Set DEPLOY_USER in GitHub secrets}"
          : "${SSH_PRIVATE_KEY:?Set DEPLOY_SSH_KEY in GitHub secrets}"
          : "${SSH_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS in GitHub secrets}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes -o BatchMode=yes -p "$SERVER_PORT")
          tar -czf - docker-compose.prod.yml nginx/default.conf scripts/deploy_remote.sh |
            ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_HOST" \
              'mkdir -p /opt/lms-system && tar -xzf - -C /opt/lms-system'
          ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_HOST" \
            "cd /opt/lms-system && IMAGE_NAME='$DEPLOY_IMAGE' bash scripts/deploy_remote.sh"
      - name: Check public health endpoint
        env:
          HEALTHCHECK_URL: http://${{ secrets.DEPLOY_HOST }}/health/
        run: curl --fail --show-error --silent --retry 5 --retry-delay 3 "$HEALTHCHECK_URL"
